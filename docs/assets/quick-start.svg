<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="jig quick start: step one installs into exactly one CLI, Claude Code through the plugin marketplace or Codex and Antigravity through install.sh; step two runs project-setup, which verifies the GitHub profile without touching the global account, settles the version rubric into .jig/versioning.md, converges the main and develop branches through github-sync and offers branch protection where the plan allows it, and checks the install with jig-doctor; step three verifies with a read-only jig-doctor report covering version, drift, branch protection, profile and rubric, naming the skill that fixes each finding; from then on every task runs through develop-task-flow into develop and every release through github-release from develop to main with a tag">
  <style>
    .ln  { stroke: #8b949e; fill: none; stroke-width: 1.4; }
    .box { stroke: #8b949e; fill: none; stroke-width: 1.4; }
    .inner { stroke: #8b949e; fill: none; stroke-width: 1; opacity: .75; }
    .tx  { fill: #57606a; }
    .dim { fill: #8b949e; }
    .dash{ stroke: #8b949e; fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .ln, .box { stroke: #7d8590; }
      .inner, .dash { stroke: #768390; }
      .tx  { fill: #adbac7; }
      .dim { fill: #768390; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" class="ln"/>
    </marker>
  </defs>

  <!-- step 1: install -->
  <rect class="box" x="24" y="44" width="240" height="210" rx="6"/>
  <text class="tx"  x="144" y="70" text-anchor="middle" font-size="13">1 · install</text>
  <text class="dim" x="144" y="86" text-anchor="middle" font-size="9">pick the one CLI you use</text>

  <rect class="inner" x="40" y="98" width="208" height="38" rx="5"/>
  <text class="tx"  x="144" y="116" text-anchor="middle" font-size="11">Claude Code</text>
  <text class="dim" x="144" y="129" text-anchor="middle" font-size="8.5">/plugin install jig@jig</text>

  <rect class="inner" x="40" y="144" width="208" height="38" rx="5"/>
  <text class="tx"  x="144" y="162" text-anchor="middle" font-size="11">Codex</text>
  <text class="dim" x="144" y="175" text-anchor="middle" font-size="8.5">install.sh --target codex</text>

  <rect class="inner" x="40" y="190" width="208" height="38" rx="5"/>
  <text class="tx"  x="144" y="208" text-anchor="middle" font-size="11">Antigravity</text>
  <text class="dim" x="144" y="221" text-anchor="middle" font-size="8.5">install.sh --target antigravity</text>

  <text class="dim" x="144" y="244" text-anchor="middle" font-size="8.5">/jig:&lt;skill&gt; · .agents/skills/jig-*</text>

  <line class="ln" x1="266" y1="149" x2="312" y2="149" marker-end="url(#ah)"/>

  <!-- step 2: project-setup -->
  <rect class="box" x="316" y="44" width="252" height="210" rx="6"/>
  <text class="tx"  x="442" y="70" text-anchor="middle" font-size="13">2 · project-setup</text>
  <text class="dim" x="442" y="86" text-anchor="middle" font-size="9">one run, four outcomes</text>

  <text class="tx"  x="336" y="114" font-size="10">1 github profile</text>
  <text class="dim" x="346" y="127" font-size="8.5">verified · global account untouched</text>

  <text class="tx"  x="336" y="150" font-size="10">2 version rubric</text>
  <text class="dim" x="346" y="163" font-size="8.5">→ .jig/versioning.md</text>

  <text class="tx"  x="336" y="186" font-size="10">3 github-sync</text>
  <text class="dim" x="346" y="199" font-size="8.5">main · develop · protection (optional)</text>

  <text class="tx"  x="336" y="222" font-size="10">4 jig-doctor</text>
  <text class="dim" x="346" y="235" font-size="8.5">installation checked</text>

  <line class="ln" x1="570" y1="149" x2="616" y2="149" marker-end="url(#ah)"/>

  <!-- step 3: verify -->
  <rect class="box" x="620" y="44" width="236" height="210" rx="6"/>
  <text class="tx"  x="738" y="70" text-anchor="middle" font-size="13">3 · verify</text>
  <text class="dim" x="738" y="86" text-anchor="middle" font-size="9">jig-doctor — read-only</text>

  <text class="dim" x="638" y="118" font-size="9">installed version · file drift</text>
  <text class="dim" x="638" y="140" font-size="9">branch protection · branch state</text>
  <text class="dim" x="638" y="162" font-size="9">github profile · rubric file</text>
  <text class="dim" x="638" y="184" font-size="9">legacy leftovers · push guard</text>
  <text class="dim" x="638" y="212" font-size="9">every finding names the skill</text>
  <text class="dim" x="638" y="225" font-size="9">that fixes it</text>

  <!-- from there on -->
  <path class="dash" d="M738,254 L738,272 L222,272 L222,286" marker-end="url(#ah)"/>
  <text class="dim" x="480" y="266" text-anchor="middle" font-size="9">then, on every task</text>

  <rect class="box" x="24" y="290" width="396" height="58" rx="6"/>
  <text class="tx"  x="222" y="314" text-anchor="middle" font-size="12">develop-task-flow</text>
  <text class="dim" x="222" y="332" text-anchor="middle" font-size="9">feature/fix/chore → squash merge → develop</text>

  <line class="ln" x1="422" y1="319" x2="450" y2="319" marker-end="url(#ah)"/>

  <rect class="box" x="454" y="290" width="402" height="58" rx="6"/>
  <text class="tx"  x="655" y="314" text-anchor="middle" font-size="12">github-release</text>
  <text class="dim" x="655" y="332" text-anchor="middle" font-size="9">develop → main fast-forward · tag · release</text>
</svg>
