name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
commitish: main
category-template: |
  ---

  ### $TITLE
categories:
  - title: "🚀 Enhancements"
    labels:
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "fix"
  - title: "🧰 Chores"
    labels:
      - "chore"
change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
  patch:
    labels:
      - "patch"
  default: patch
autolabeler:
  - label: "patch"
    title:
      - "/^patch:/i"
  - label: "minor"
    title:
      - "/^minor:/i"
  - label: "major"
    title:
      - "/^major:/i"
  - label: "enhancement"
    title:
      - "/^feat:/i"
      - "/^feature:/i"
      - "/^enhancement:/i"
  - label: "fix"
    title:
      - "/^fix:/i"
      - "/^bugfix:/i"
  - label: "chore"
    title:
      - "/^chore:/i"
      - "/^docs:/i"
      - "/^refactor:/i"
      - "/^test:/i"
      - "/^ci:/i"
template: |
  ## Changes

  $CHANGES

  ### Summary

  <!-- spai:release-summary:start -->
  - 요약할 변경사항이 없습니다.
  <!-- spai:release-summary:end -->
