name: Draft new release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  update_release_draft:
    name: update_release_draft
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate release workflow
        if: github.event_name == 'pull_request'
        run: echo "Release drafting runs after this PR is merged to main."

      - name: Release
        if: github.event_name == 'push'
        # reference: https://github.com/release-drafter/release-drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: drafter-config.yaml
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open back-merge PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin main develop

          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "develop branch does not exist; skipping back-merge PR."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main; skipping back-merge PR."
            exit 0
          fi

          existing_pr="$(
            gh pr list \
              --base develop \
              --state open \
              --json number,title \
              --jq '.[] | select(.title == "chore: back-merge main into develop") | .number' \
              | head -n 1
          )"

          if [ -n "$existing_pr" ]; then
            echo "Back-merge PR #$existing_pr already exists; skipping."
            exit 0
          fi

          branch="chore/back-merge-main-to-develop-${GITHUB_RUN_ID}"
          git checkout -B "$branch" origin/develop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/main -m "chore: back-merge main into develop"
          git push origin "$branch"

          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: back-merge main into develop" \
            --body "Automated back-merge PR after a release was published from main."
